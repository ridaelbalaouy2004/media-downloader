<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Media Downloader</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-drag: none;
    }

    body {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }

    .splash-card {
      width: 480px;
      height: 290px;
      background: linear-gradient(145deg, #0d0e17 0%, #151828 50%, #0c0d15 100%);
      border: 1px solid rgba(139, 92, 246, 0.25);
      border-radius: 20px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8),
                  0 0 60px -10px rgba(99, 102, 241, 0.25),
                  inset 0 1px 0 rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 32px 28px 24px;
      position: relative;
      overflow: hidden;
    }

    /* Ambient glow effects */
    .glow-orb {
      position: absolute;
      width: 220px;
      height: 220px;
      background: radial-gradient(circle, rgba(124, 58, 237, 0.22) 0%, rgba(99, 102, 241, 0.08) 50%, transparent 70%);
      top: -60px;
      left: 50%;
      transform: translateX(-50%);
      filter: blur(30px);
      pointer-events: none;
    }

    /* Header with app icon and title */
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 2;
    }

    .icon-box {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: linear-gradient(135deg, #6366f1 0%, #4f46e5 50%, #7c3aed 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.5),
                  inset 0 1px 0 rgba(255, 255, 255, 0.3);
    }

    .icon-box svg {
      width: 24px;
      height: 24px;
      stroke: #ffffff;
      fill: none;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .title-group {
      text-align: left;
    }

    .app-title {
      font-size: 19px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #ffffff;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
    }

    .app-subtitle {
      font-size: 11px;
      font-weight: 500;
      color: rgba(165, 180, 252, 0.8);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-top: 1px;
    }

    /* Center developer signature - clear, centered, and prominent */
    .signature-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 2;
      margin: 14px 0;
      text-align: center;
    }

    .signature-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 16px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 9999px;
      margin-bottom: 8px;
    }

    .signature-badge svg {
      width: 14px;
      height: 14px;
      fill: #a78bfa;
    }

    .signature-badge span {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #c4b5fd;
      font-weight: 600;
    }

    .signature-name {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.01em;
      background: linear-gradient(135deg, #ffffff 30%, #ddd6fe 70%, #a78bfa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 25px rgba(167, 139, 250, 0.35);
    }

    .signature-text {
      font-size: 17px;
      font-weight: 700;
      color: #f1f5f9;
      letter-spacing: -0.01em;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .signature-text .highlight {
      background: linear-gradient(135deg, #a78bfa 0%, #818cf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Footer / Progress indicator */
    .footer {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      z-index: 2;
    }

    .progress-track {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 9999px;
      overflow: hidden;
      position: relative;
    }

    .progress-bar {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 35%;
      background: linear-gradient(90deg, transparent, #818cf8, #a78bfa, transparent);
      border-radius: 9999px;
      animation: sweep 1.6s ease-in-out infinite;
    }

    @keyframes sweep {
      0% {
        left: -35%;
      }
      100% {
        left: 100%;
      }
    }

    .status-text {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.4);
      font-weight: 500;
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>
  <div class="splash-card">
    <div class="glow-orb"></div>

    <!-- Header -->
    <div class="header">
      <div class="icon-box">
        <svg viewBox="0 0 24 24">
          <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
      </div>
      <div class="title-group">
        <div class="app-title">Media Downloader</div>
        <div class="app-subtitle">Desktop Edition</div>
      </div>
    </div>

    <!-- Center: Developer Signature (Clear, Prominent, Centered) -->
    <div class="signature-container">
      <div class="signature-text">
        Developed by <span class="highlight">Reda Elbalaouy</span>
      </div>
    </div>

    <!-- Footer: Animated loader -->
    <div class="footer">
      <div class="progress-track">
        <div class="progress-bar"></div>
      </div>
      <div class="status-text">Starting application...</div>
    </div>
  </div>
</body>
</html>
